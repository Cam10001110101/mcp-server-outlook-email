name: Security

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Tests and static analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[graph,dev]" bandit pip-audit

      - name: Ruff (security modules and tests)
        # The legacy modules predate ruff; lint the hardened code and tests.
        run: ruff check src/security_utils.py src/exporters.py tests .github/scripts

      - name: Pytest
        run: pytest -q

      - name: Bandit (medium+ severity)
        run: bandit -r src -ll

      - name: pip-audit (known CVEs in resolved dependencies)
        run: pip-audit --skip-editable --progress-spinner off

  llm-review:
    name: LLM security review (advisory)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    # Advisory only: never blocks merging. Runs only when the secret is set
    # (secrets are not exposed to fork PRs under the pull_request trigger).
    continue-on-error: true
    env:
      OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
      OLLAMA_REVIEW_MODEL: ${{ vars.OLLAMA_REVIEW_MODEL || 'deepseek-v4.1-flash' }}
    steps:
      - uses: actions/checkout@v4
        if: env.OLLAMA_API_KEY != ''
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        if: env.OLLAMA_API_KEY != ''
        with:
          python-version: "3.12"

      - name: Review PR diff
        if: env.OLLAMA_API_KEY != ''
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          python .github/scripts/llm_security_review.py --diff "$BASE_SHA...HEAD" > review.md
          cat review.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload review
        if: env.OLLAMA_API_KEY != ''
        uses: actions/upload-artifact@v4
        with:
          name: llm-security-review
          path: review.md

      - name: Skipped (no OLLAMA_API_KEY secret)
        if: env.OLLAMA_API_KEY == ''
        run: echo "Set the OLLAMA_API_KEY repository secret to enable the DeepSeek review." >> "$GITHUB_STEP_SUMMARY"
